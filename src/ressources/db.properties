# ??????????????????????????????????????????????????????????????????
#  CineScoop ? Database Configuration
#  Location: src/main/resources/db.properties
# ??????????????????????????????????????????????????????????????????

# ?? MySQL Connection ???????????????????????????????????????????????
db.url=jdbc:mysql://localhost:3306/cinescoop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=root
db.password=

# ?? HikariCP Pool Settings ?????????????????????????????????????????
# Maximum number of connections in the pool
db.pool.size=10

# Minimum idle connections kept ready
db.pool.minIdle=2

# Time (ms) before an idle connection is removed  (5 minutes)
db.pool.idleTimeout=300000

# Maximum lifetime of a connection in the pool     (30 minutes)
db.pool.maxLifetime=1800000

# Time (ms) to wait for a connection before error  (30 seconds)
db.pool.timeout=30000